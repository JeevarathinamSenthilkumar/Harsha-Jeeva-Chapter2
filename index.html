const KEY='wayfare_trips_v1';let trips=load(),selected=trips[0]?.id||null,tab='overview',day=0;const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateText=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'',dayISO=(start,n)=>{let d=new Date(start+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},days=t=>Math.max(1,Math.min(180,Math.round((new Date(t.end+'T12:00:00')-new Date(t.start+'T12:00:00'))/86400000)+1));function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return []}}function save(){localStorage.setItem(KEY,JSON.stringify(trips))}function current(){return trips.find(t=>t.id===selected)}function stats(t){let paid=0,due=0,planned=0;for(const a of t.items){let cost=+a.cost||0,p=Math.min(cost,+a.paid||0);paid+=p;if(a.status==='booked')due+=cost-p;else if(a.status==='planned')planned+=cost-p;else if(a.status==='expense')due+=cost-p}return{paid,due,planned,available:t.budget-paid-due-planned,allocated:paid+due+planned}}function button(label,fn,cl='secondary'){return `<button class="btn ${cl}" onclick="${fn}">${label}</button>`}function render(){let t=current();$('app').innerHTML=`<div class="container">${!t?`<section class="hero"><div class="tag">HARSHA ❤️ JEEVA · CHAPTER TWO</div><h1>Our anniversary adventure.</h1><p>Plan your days, keep reservations in one place, navigate to your next stop, and stay on top of your budget.</p>${button('Create your first trip','openTripForm()','')}</section><div class="card empty" style="margin-top:22px"><strong>No trips yet</strong>Create a trip to start planning your adventure.</div>`:`<div class="row" style="margin-bottom:16px"><select aria-label="Choose trip" onchange="selected= 75"></div><div style="width:${Math.min(100,s.due/(t.budget||1)*100)}%;background:#e8a957"></div><div style="width:${Math.min(100,s.planned/(t.budget||1)*100)}%;background:#8886c6"></div></div><div class="notice">🟢 Paid ${money(s.paid)} &nbsp; 🟠 Booked/unpaid ${money(s.due)} &nbsp; 🟣 Planned ${money(s.planned)}</div></div>`}function content(t){if(tab==='overview')return `${metrics(t)}<div class="section"><h2>Upcoming itinerary</h2><button class="link" onclick="tab='timeline';render()">View timeline →</button></div>${itemsList(t.items.filter(a=>a.date>=new Date().toISOString().slice(0,10)).sort(sortItems).slice(0,5),true)}<div class="section"><h2>Manage your trip</h2></div><div class="actions">${button('＋ Add to trip','openItemForm()')}${button('Delete trip','deleteTrip()','danger')}</div>`;if(tab==='timeline')return `<div class="section"><h2>Day-by-day planner</h2>${button('＋ Add','openItemForm()','small')}</div><div class="day-select">${Array.from({length:days(t)},(_,i)=>`<button class="day ${day===i?'active':''}" onclick="day=${i};render()">Day ${i+1}<small>${dateText(dayISO(t.start,i)).replace(/, \d{4}/,'')}</small></button>`).join('')}</div><div class="row" style="margin:10px 0 16px"><h3 style="margin:0">${dateText(dayISO(t.start,day))}</h3><button class="link" onclick="tab='map';render()">View map →</button></div><div class="timeline">${itemsList(timelineEvents(t.items,dayISO(t.start,day)),true)}</div>`;if(tab==='map'){let points=t.items.filter(a=>a.lat&&a.lon),focus=points.find(a=>a.date===dayISO(t.start,day))||points[0];return `<div class="section"><h2>Trip map</h2></div>${focus?`<iframe title="OpenStreetMap showing ${esc(focus.name)}" class="map" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${+focus.lon-.06}%2C${+focus.lat-.04}%2C${+focus.lon+.06}%2C${+focus.lat+.04}&layer=mapnik&marker=${focus.lat}%2C${focus.lon}"></iframe>`:`<div class="card empty"><strong>No mapped places yet</strong>Search for a place when adding an activity to display it here.</div>`}<div class="section"><h2>Places in your trip</h2></div>${itemsList(points,true)}<p class="notice">Map preview uses OpenStreetMap. Tap Directions to open Google Maps from your current location. Select an activity to focus its location.</p>`}if(tab==='reservations')return `<div class="section"><h2>Reservations & plans</h2>${button('＋ Add','openItemForm()','small')}</div>${itemsList(t.items.filter(a=>a.status!=='expense').sort(sortItems),true)}`;if(tab==='expenses')return `<div class="section"><h2>Payments & expenses</h2>${button('＋ Add','openItemForm()','small')}</div>${metrics(t)}<div class="section"><h2>All costs</h2></div>${itemsList(t.items.filter(a=>+a.cost>0).sort(sortItems),false)}`;if(tab==='reports'){let cats={};t.items.forEach(a=>{let c=a.category||'Other';cats[c]=(cats[c]||0)+(+a.cost||0)});let s=stats(t);return `<div class="section"><h2>Trip spending report</h2>${button('Print / PDF','window.print()','small')}</div>${metrics(t)}<div class="section"><h2>Cost by category</h2></div><div class="card">${Object.entries(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin-bottom:15px"><div class="row"><b>${esc(c)}</b><b>${money(v)}</b></div><div class="bar" style="margin-top:7px"><div style="width:${Math.min(100,v/(s.allocated||1)*100)}%;background:#328b75"></div></div></div>`).join(''):'No expenses recorded yet.'}</div><p class="notice">Report includes both paid and future committed or planned costs. Export a backup to preserve your trip data.</p>`}return ''}function timelineEvents(items,d){let events=[];for(const a of items){if(a.date===d)events.push({...a,_event:'start'});if((a.category==='Flights'||a.category==='Car Rental')&&a.arrivalDate===d)events.push({...a,_event:'end'});if(a.category==='Flights'&&a.returnDate===d)events.push({...a,_event:'returnStart'});if(a.category==='Flights'&&a.returnArrivalDate===d)events.push({...a,_event:'returnEnd'})}return events.sort((a,b)=>eventTime(a).localeCompare(eventTime(b)))}function eventTime(a){return a._event==='end'?a.arrivalTime||'00:00':a._event==='returnStart'?a.returnTime||'00:00':a._event==='returnEnd'?a.returnArrivalTime||'00:00':a.time||'00:00'}function sortItems(a,b){return(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))}function itemsList(items,withNav){return items.length?`<div class="list">${items.map(a=>{let e=a._event||'start',range=a.category==='Flights'||a.category==='Car Rental',flight=a.category==='Flights',label=range?(flight?({start:'🛫 Outbound departure',end:'🛬 Outbound arrival',returnStart:'🛫 Return departure',returnEnd:'🛬 Return arrival'}[e]):(e==='end'?'🚗 Drop-off':'🚗 Pickup')):'',when=e==='end'?a.arrivalDate:e==='returnStart'?a.returnDate:e==='returnEnd'?a.returnArrivalDate:a.date,at=eventTime(a),place=e==='end'?a.arrivalAirport:e==='returnStart'?a.returnAirport:e==='returnEnd'?a.returnDestination:a.departureAirport;return `<div class="list-item"><div style="min-width:0"><div class="time">${dateText(when)} ${esc(at||'—')} ${label}</div><h3>${esc(a.name)}${range&&a._event?' · '+label:''}</h3><p>${esc(a.category||'Other')} · ${esc(a.status)} · ${money(a.cost)} total · paid ${money(a.paid)}</p>${range?`<p>${flight?'✈':'🚗'} ${esc(place||'Location not set')}</p>`:''}${a.address&&!range?`<p>📍 ${esc(a.address)}</p>`:''}</div><div class="actions" style="justify-content:flex-end">${range&&place?`<button class="btn small secondary" onclick="directions('${a.id}','${e}')">↗ Directions</button>`:!range&&(a.address||a.lat)?`<button class="btn small secondary" onclick="directions('${a.id}')">↗ Directions</button>`:''}<button class="btn small outline" onclick="openItemForm('${a.id}')">Details</button></div></div>`}).join('')}</div>`:`<div class="card empty"><strong>Nothing scheduled here yet</strong>Add an activity, reservation, or expense whenever you're ready.<div style="margin-top:15px">${button('＋ Add','openItemForm()','small')}</div></div>`}function showModal(html){$('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row" style="margin-bottom:14px"><b class="tag" style="color:#48756a">HARSHA ❤️ JEEVA · CHAPTER TWO</b><button class="close" onclick="closeModal()">✕</button></div>${html}</div></div>`}function closeModal(){$('overlay').innerHTML=''}function openTripForm(id){let t=trips.find(x=>x.id===id)||{name:'',destination:'',start:new Date().toISOString().slice(0,10),end:new Date().toISOString().slice(0,10),travelers:2,budget:3000};showModal(`<h2>${id?'Edit trip':'Create your trip'}</h2><form id="tripForm" class="form-grid"><div class="field wide"><label>Trip name</label><input name="name" required value="${esc(t.name)}" placeholder="Washington Anniversary Trip"></div><div class="field wide"><label>Destinations</label><input name="destination" value="${esc(t.destination)}" placeholder="Seattle, Leavenworth, Mount Rainier"></div><div class="field"><label>Start date</label><input type="date" name="start" required value="${t.start}"></div><div class="field"><label>End date</label><input type="date" name="end" required value="${t.end}"></div><div class="field"><label>Travelers</label><input type="number" min="1" name="travelers" required value="${t.travelers}"></div><div class="field"><label>Total budget ($)</label><input type="number" min="0" step="0.01" name="budget" required value="${t.budget}"></div><div class="wide">${button(id?'Save changes':'Create trip','', '')}</div></form>`);$('tripForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);if(o.end<o.start)return alert('End date must be after start date.');if(id){Object.assign(t,o,{travelers:+o.travelers,budget:+o.budget})}else{t={...o,id:uid(),travelers:+o.travelers,budget:+o.budget,items:[]};trips.push(t)}selected=t.id;save();closeModal();tab='overview';render()}}function openItemForm(id,kind,category){
let t=current(),a=t.items.find(x=>x.id===id)||{name:'',date:dayISO(t.start,day),time:'10:00',category:category||'Activities',status:kind||'planned',cost:0,paid:0,address:'',lat:'',lon:'',confirmation:'',notes:'',arrivalDate:'',arrivalTime:'',departureAirport:'',arrivalAirport:'',flightNumber:'',rentalCompany:'',returnDate:'',returnTime:'',returnAirport:'',returnArrivalDate:'',returnArrivalTime:'',returnDestination:'',returnFlightNumber:'',sameDropoff:true};
const field=(label,name,type='text',placeholder='',value=a[name]||'',required=false)=>`<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''} value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`;
const row=(...parts)=>`<div class="booking-grid">${parts.join('')}</div>`;
const section=(cl,title,inner)=>`<section class="booking-section ${cl}"><div class="booking-section-title">${title}</div><div class="booking-section-body">${inner}</div></section>`;
const airport=(label,name,placeholder)=>field(label,name,'text',placeholder,a[name]||'',false);
const flightForm=`<div class="booking-choice"><label>Trip type</label><select name="flightTripType" onchange="toggleFlightFields()"><option value="round" ${a.flightTripType!=='oneway'?'selected':''}>Round trip</option><option value="oneway" ${a.flightTripType==='oneway'?'selected':''}>One way</option></select></div><p class="booking-tip">Both journeys belong to one booking. Use the local time shown on your ticket for each airport.</p>
${section('outbound','✈ 1. Departure Flight (Outbound)',row(airport('From — departure airport','departureAirport','El Paso (ELP)'),airport('To — arrival airport','arrivalAirport','Seattle (SEA)'))+row(field('Departure date','date','date','',a.date),field('Departure time','time','time','',a.time),field('Arrival date','arrivalDate','date','',a.arrivalDate),field('Arrival time','arrivalTime','time','',a.arrivalTime))+field('Flight number (optional)','flightNumber','text','WN 1234'))}
<div id="returnFlightFields">${section('inbound','✈ 2. Return Flight (Inbound)',row(airport('From — departure airport','returnAirport','Seattle (SEA)'),airport('To — arrival airport','returnDestination','El Paso (ELP)'))+row(field('Departure date','returnDate','date','',a.returnDate),field('Departure time','returnTime','time','',a.returnTime),field('Arrival date','returnArrivalDate','date','',a.returnArrivalDate),field('Arrival time','returnArrivalTime','time','',a.returnArrivalTime))+field('Flight number (optional)','returnFlightNumber','text','WN 4321'))}</div>`;
const carForm=`${row(field('Rental company','rentalCompany','text','Enterprise, Hertz, Avis',a.rentalCompany))}
${section('pickup','📍 Pickup Details',field('Pickup location','departureAirport','text','Seattle-Tacoma Airport (SEA)',a.departureAirport)+row(field('Pickup date','date','date','',a.date),field('Pickup time','time','time','',a.time)))}
${section('dropoff','🏁 Drop-off Details',`<label class="same-place"><input type="checkbox" name="sameDropoff" ${a.sameDropoff!==false?'checked':''} onchange="syncRentalLocation()"> Same as pickup location</label>`+field('Drop-off location','arrivalAirport','text','Seattle-Tacoma Airport (SEA)',a.arrivalAirport)+row(field('Drop-off date','arrivalDate','date','',a.arrivalDate),field('Drop-off time','arrivalTime','time','',a.arrivalTime)))}`;
const genericForm=`${row(field('Activity date','date','date','',a.date),field('Activity time','time','time','',a.time))}<div class="field"><label>Place / address</label><div class="row"><input id="address" name="address" value="${esc(a.address)}" placeholder="Search or enter a destination"><button class="btn small secondary" type="button" onclick="searchPlace()">Find</button></div><div id="placeResults" class="notice"></div></div>`;
showModal(`<h2>${id?'Edit booking or activity':'Add to your trip'}</h2><form id="itemForm" class="booking-form"><div class="field"><label>What are you adding?</label><select name="category" onchange="toggleFlightFields()">${['Activities','Flights','Car Rental','Stays','Food','Transportation','Shopping','Other'].map(x=>`<option ${a.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div id="bookingTitle" class="field"><label id="nameLabel">Name / booking description</label><input name="name" value="${esc(a.name)}" placeholder="e.g. Southwest Airlines or Enterprise rental"></div><div id="flightBooking" class="booking-pane">${flightForm}</div><div id="carBooking" class="booking-pane">${carForm}</div><div id="genericBooking" class="booking-pane">${genericForm}</div>
${section('payment','▣ Booking Information',row(field('Airline (for flights)','airline','text','Southwest Airlines',a.airline),field('Confirmation number','confirmation','text','Reservation number',a.confirmation))+row(field('Total cost (USD)','cost','number','0.00',a.cost),field('Amount paid (USD)','paid','number','0.00',a.paid)))}
<div class="field"><label>Planning status</label><select name="status">${[['planned','Planned, not booked'],['booked','Booked / committed'],['expense','Actual expense']].map(([v,l])=>`<option value="${v}" ${a.status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Notes (optional)</label><textarea name="notes">${esc(a.notes)}</textarea></div><input type="hidden" name="lat" id="lat" value="${esc(a.lat)}"><input type="hidden" name="lon" id="lon" value="${esc(a.lon)}"><div class="booking-actions"><button class="btn" type="submit">Save ${id?'changes':'to trip'}</button>${id?`<button class="btn danger" type="button" onclick="deleteItem('${id}')">Delete</button>`:''}<button class="btn secondary" type="button" onclick="closeModal()">Cancel</button></div></form>`);
toggleFlightFields();
$('itemForm').onsubmit=e=>{e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f));o.cost=+o.cost||0;o.paid=+o.paid||0;let flight=o.category==='Flights',car=o.category==='Car Rental',range=flight||car;
if(!o.name.trim())o.name=flight?(o.airline||'Round-trip flight'):car?(o.rentalCompany||'Car rental'):'Activity';
if(range){if(!o.date||!o.time||!o.departureAirport||!o.arrivalDate||!o.arrivalTime||!o.arrivalAirport)return alert('Complete the departure/arrival or pickup/drop-off location, date, and time.');if(o.arrivalDate<o.date)return alert('Arrival or drop-off date must not be earlier than departure or pickup.');if(car&&o.arrivalDate===o.date&&o.arrivalTime<=o.time)return alert('Drop-off must be later than pickup.');}
if(flight&&o.flightTripType==='round'){if(!o.returnAirport||!o.returnDestination||!o.returnDate||!o.returnTime||!o.returnArrivalDate||!o.returnArrivalTime)return alert('Complete both airports, dates, and times for your return flight.');if(o.returnArrivalDate<o.returnDate||o.returnDate<o.date)return alert('Check the return flight dates.');}
if(car){o.sameDropoff=f.elements.sameDropoff.checked;if(o.sameDropoff)o.arrivalAirport=o.departureAirport;}else o.sameDropoff=false;
if(!flight||o.flightTripType==='oneway'){for(let k of ['returnDate','returnTime','returnAirport','returnDestination','returnArrivalDate','returnArrivalTime','returnFlightNumber'])o[k]='';}
if(!range){for(let k of ['arrivalDate','arrivalTime','departureAirport','arrivalAirport','flightNumber','rentalCompany'])o[k]='';}
if(o.paid>o.cost)return alert('Amount paid cannot exceed total cost.');if(id)Object.assign(a,o);else t.items.push({...o,id:uid()});save();closeModal();render();};}
function syncRentalLocation(){let f=$('itemForm');if(!f)return;let same=f.elements.sameDropoff.checked,drop=f.elements.arrivalAirport;drop.readOnly=same;if(same)drop.value=f.elements.departureAirport.value;f.elements.departureAirport.oninput=()=>{if(f.elements.sameDropoff.checked)drop.value=f.elements.departureAirport.value};}
function toggleFlightFields(){let f=$('itemForm');if(!f)return;let c=f.elements.category.value,flight=c==='Flights',car=c==='Car Rental';$('flightBooking').style.display=flight?'block':'none';$('carBooking').style.display=car?'block':'none';$('genericBooking').style.display=(!flight&&!car)?'block':'none';$('returnFlightFields').style.display=flight&&f.elements.flightTripType.value==='round'?'block':'none';for(const [id,active] of [['flightBooking',flight],['carBooking',car],['genericBooking',!flight&&!car]]){$(id).querySelectorAll('input,select,textarea').forEach(el=>el.disabled=!active);}if(flight&&f.elements.flightTripType.value==='oneway')$('returnFlightFields').querySelectorAll('input').forEach(el=>el.disabled=true);let air=f.elements.airline.closest('.field');air.style.display=flight?'block':'none';$('nameLabel').textContent=flight?'Booking name (optional)':car?'Rental description (optional)':'Name / activity description';if(car)syncRentalLocation();}
async function searchPlace(){let q=$('address').value.trim();if(!q)return;let el=$('placeResults');el.textContent='Searching places…';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});if(!r.ok)throw Error();let places=await r.json();if(!places.length){el.textContent='No matches. You can still enter an address manually.';return}el.innerHTML=places.map((p,i)=>`<button type="button" class="link" style="display:block;text-align:left;padding:7px 0" onclick="choosePlace(${i})">📍 ${esc(p.display_name)}</button>`).join('');window._places=places}catch{el.textContent='Search unavailable. Enter the address manually.'}}function choosePlace(i){let p=window._places[i];$('address').value=p.display_name;$('lat').value=p.lat;$('lon').value=p.lon;$('placeResults').textContent='Location selected ✓'}function directions(id,endpoint){let a=current()?.items.find(x=>x.id===id);if(!a)return;let dest=endpoint==='end'?a.arrivalAirport:endpoint==='returnStart'?a.returnAirport:endpoint==='returnEnd'?a.returnDestination:endpoint==='start'?a.departureAirport:(a.lat&&a.lon?`${a.lat},${a.lon}`:a.address);if(!dest)return alert('Add a location first.');window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'&travelmode=driving','_blank','noopener')}function deleteItem(id){if(!confirm('Delete this item?'))return;current().items=current().items.filter(a=>a.id!==id);save();closeModal();render()}function deleteTrip(){if(!confirm('Delete this trip and all its details? This cannot be undone.'))return;trips=trips.filter(t=>t.id!==selected);selected=trips[0]?.id||null;save();render()}function exportData(){let blob=new Blob([JSON.stringify({version:1,trips},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='harsha-jeeva-anniversary-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importData(){let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{let o=JSON.parse(await inp.files[0].text());if(!Array.isArray(o.trips)||!confirm('Import this backup? Existing trips will be replaced.'))return;trips=o.trips;selected=trips[0]?.id||null;save();render()}catch{alert('Invalid backup file.')}};inp.click()}render();
</script></body></html>
